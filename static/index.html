<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feelscape · Emotion detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-emotion="neutral">
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="spot" id="spot" aria-hidden="true"></div>

<main>
  <header>
    <p class="status"><span class="dot" id="dot"></span><span id="statusText">Connecting to model…</span></p>
    <h1>How does this sentence feel?</h1>
    <p class="sub">Type anything. A bidirectional GRU network reads it and scores six emotions.</p>
  </header>

  <section class="card">
    <label class="sr" for="input">Your sentence</label>
    <textarea id="input" rows="3" maxlength="2000" placeholder="Write how your day went…"></textarea>
    <div class="row">
      <span class="count"><b id="count">0</b> / 2000</span>
      <span class="kbd">Ctrl + Enter to run</span>
      <button id="go" class="btn" type="button"><span class="lbl">Analyze</span><span class="spin"></span></button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="result" id="result" hidden aria-live="polite">
    <div class="hero">
      <div class="ring">
        <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="54"/><circle class="arc" id="arc" cx="60" cy="60" r="54"/></svg>
        <span class="emoji" id="emoji"></span>
      </div>
      <div class="meta">
        <p class="small">This reads as</p>
        <h2 id="label"></h2>
        <p class="conf"><b id="pct">0</b>% confident</p>
      </div>
    </div>
    <ul class="bars" id="bars"></ul>
  </section>

  <section class="history" id="history" hidden>
    <h3>Recent</h3>
    <ul id="hist"></ul>
  </section>
</main>
<div class="toast" id="toast" role="alert"></div>
<script src="/static/script.js"></script>
</body>
</html>
